[package]
name = "acta"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
# `bundled` compiles DuckDB's C++ amalgamation (~10 min cold). Parquet and JSON
# imply it, and the alternative — downloading a prebuilt library — trade a
# self-contained build for an unverified GitHub artifact plus a second file to
# ship.
duckdb = { version = "1.20000.0", features = ["bundled", "parquet", "json"] }
futures = "0.3"
object_store = { version = "0.12", default-features = false, features = ["aws", "tls-webpki-roots"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
subtle = "2.6"
tokio = { version = "1.53.3", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["fs", "catch-panic", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
strip = "symbols"
