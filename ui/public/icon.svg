<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Ink plate, a white series over a white baseline: a chart, not a letter.
       The corners are transparent, so the mark sits on a light tab bar or a
       dark launcher and still reads. -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="#000000" />
  <path d="M104 356h304" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" />
  <path
    d="M120 300l60-36 52 44 60-92 52 32 56-60"
    fill="none"
    stroke="#ffffff"
    stroke-width="24"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
